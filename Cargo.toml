[workspace]
resolver = "2"
# The runtime is a workspace of its own (runtime/Cargo.toml).
exclude = ["runtime"]
members = [
    "apps/aura",
    "crates/aura-core",
    "crates/aura-formats",
    "crates/aura-gpu",
    "crates/aura-hle",
    "crates/aura-loader",
    "crates/aura-shader",
]

[profile.release]
debug = "line-tables-only"
